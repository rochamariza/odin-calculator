<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>
    <h1>Calculator</h1>
    <div class="container">
        <div class="screen">
            <h1 class="result"></h1>
        </div>
        <div class="box">
            <input type="text" name="type" id="type" class="type">
            <button class="calculate">=</button>
            <button class="clear">C</button>
        </div>
        <div class="type">
            <div class="numbers">
                <button class="one" value="1">1</button>
                <button class="two" value="2">2</button>
                <button class="three" value="3">3</button>
                <button class="four" value="4">4</button>
                <button class="five" value="5">5</button>
                <button class="six" value="6">6</button>
                <button class="seven" value="7">7</button>
                <button class="eight" value="8">8</button>
                <button class="nine" value="9">9</button>
                <button class="zero" value="0">0</button>
            </div>
            <div class="signals">
                <button class="sum" value="+">+</button>
                <button class="sub" value="-">-</button>
                <button class="mul" value="/">/</button>
                <button class="div" value="*">*</button>
            </div>
        </div>

    </div>


    <script src="index.js"></script>
</body>
</html>
